name: CI

# 最小质量门禁：后端测试 + 前端静态分析与测试
#
# 原则：**CI 命令 = 本地门禁命令**（scripts/quality-gate.ps1 的 [1/3]~[3/3] 三步），
# 因此这里不做任何"CI 专用"的环境准备 —— 本地怎么过，CI 就怎么过。
#
# 后端测试的中间件（PostgreSQL / Redis / MinIO）由 Testcontainers 在测试 JVM 内现拉现用
# （见 backend/src/test/java/com/campustrade/support/TestContainersConfig.java），因此：
#   - 不需要 GitHub Actions 的 services 段；
#   - 不需要注入 SPRING_DATASOURCE_* / SPRING_DATA_REDIS_* / MINIO_*（容器地址与随机端口由
#     Testcontainers 动态注入，测试也更接近"干净库"的语义）；
#   - 不需要生成 JWT_SECRET：测试用的密钥由 TestContainersConfig 在测试 JVM 内随机生成，
#     并通过 PropertySource（addFirst，优先级最高）注入 jwt.secret，任何外部 env 都会被它覆盖。
#     该步骤此前只是空转，已随本批次删除。
#
# ⚠️ 如果将来确实要用 services 提供中间件，请勿把口令写成字面量：
#    本仓库的安全门禁会扫描硬编码凭据，CI 用的口令同样应当现取现用或走 secrets。
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端测试 (Java 21 + Maven)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 运行后端测试
        # 测试需要 Docker（Testcontainers 现拉现用 PostgreSQL / Redis / MinIO 一次性容器；
        # 镜像 tag 固定并与 docker-compose.yml 一致，见 TestContainersConfig），
        # ubuntu-latest 预装 Docker，无需额外步骤
        working-directory: backend
        run: mvn -B test

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: 前端分析 + 测试 (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 拉取依赖
        working-directory: frontend
        run: flutter pub get

      - name: 静态分析
        working-directory: frontend
        run: flutter analyze

      - name: 运行测试
        working-directory: frontend
        run: flutter test
