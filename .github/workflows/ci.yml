name: CI

# 最小质量门禁：后端测试 + 前端静态分析与测试
# 说明：后端测试目前依赖真实的 PostgreSQL / Redis，因此用 GitHub Actions 的 services 提供；
#       待测试隔离（Testcontainers）落地后可去掉 services 段。
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端测试 (Java 21 + Maven)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: campustrade
          POSTGRES_USER: campustrade
          POSTGRES_PASSWORD: campustrade
        ports:
          - 15435:5432
        options: >-
          --health-cmd "pg_isready -U campustrade -d campustrade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_DATASOURCE_HOST: 127.0.0.1
      SPRING_DATASOURCE_PORT: 15435
      SPRING_DATASOURCE_DATABASE: campustrade
      SPRING_DATASOURCE_USERNAME: campustrade
      SPRING_DATASOURCE_PASSWORD: campustrade
      SPRING_DATA_REDIS_HOST: 127.0.0.1
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ci-only-not-a-real-secret-please-override-in-production-32b

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 运行后端测试
        working-directory: backend
        run: mvn -B test

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: 前端分析 + 测试 (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 拉取依赖
        working-directory: frontend
        run: flutter pub get

      - name: 静态分析
        working-directory: frontend
        run: flutter analyze

      - name: 运行测试
        working-directory: frontend
        run: flutter test
