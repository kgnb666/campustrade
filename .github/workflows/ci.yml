name: CI

# 最小质量门禁：后端测试 + 前端静态分析与测试
#
# 后端测试的中间件（PostgreSQL / Redis / MinIO）由 Testcontainers 在测试 JVM 内现拉现用
# （见 backend/src/test/java/com/campustrade/support/TestContainersConfig.java），
# 因此这里不再需要 GitHub Actions 的 services 段，也不再注入 SPRING_DATASOURCE_* / SPRING_DATA_REDIS_*：
# 容器地址与随机端口由 Testcontainers 动态注入，测试也更接近"干净库"的语义。
#
# ⚠️ 如果将来确实要用 services 提供中间件，请勿把口令写成字面量：
#    本仓库的安全门禁会扫描硬编码凭据，CI 用的口令同样应当现取现用或走 secrets。
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端测试 (Java 21 + Maven)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 生成一次性 JWT 密钥
        # 工作流中现取现用：不把任何密钥字面量写进仓库，每次运行密钥都不同
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 运行后端测试
        # 测试需要 Docker（Testcontainers 拉取 postgres:16 / redis:7 / minio 一次性容器），
        # ubuntu-latest 预装 Docker，无需额外步骤
        working-directory: backend
        run: mvn -B test

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: 前端分析 + 测试 (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 拉取依赖
        working-directory: frontend
        run: flutter pub get

      - name: 静态分析
        working-directory: frontend
        run: flutter analyze

      - name: 运行测试
        working-directory: frontend
        run: flutter test
