# ==============================================================================
#  CampusTrade 边缘入口（容器内 Nginx）
#
#  职责：一个端口对外提供三件事，浏览器只需要访问一个地址：
#    1. /            -> Flutter Web 静态产物（SPA，深链接回退到 index.html）
#    2. /api/        -> 反向代理到后端容器 app:8081
#    3. /img/        -> 反向代理到 MinIO（商品图片），对应 MINIO_URL_PREFIX
#
#  容器名与网络：本文件被 deploy/docker-compose.edge.yml 挂进 nginx 容器，
#  该容器加入 campustrade-prod-network，因此能按"服务名"解析 app / minio。
#
#  为什么不让浏览器直连 MinIO：生产编排刻意不给 MinIO 发布任何宿主端口
#  （见 docker-compose.prod.yml 注释）。图片走 Nginx 反代后，对外只需要放通
#  一个端口，MinIO 控制台与 S3 API 依然不暴露在公网。
# ==============================================================================
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # 商品图片直传可能较大；与后端 multipart 上限保持一致
    client_max_body_size 20m;

    # --------------------------------------------------------------------------
    # 1. 前端静态产物
    # --------------------------------------------------------------------------
    location / {
        # Flutter Web 的路由在客户端，服务器上并不存在 /goods/123 这类路径：
        # 找不到的路径一律交给 index.html，否则用户刷新或直接打开深链接会 404。
        try_files $uri $uri/ /index.html;
    }

    # 入口文件与 Service Worker 必须不缓存，否则用户会一直用旧版本
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location ~ ^/(flutter_service_worker\.js|flutter_bootstrap\.js|version\.json)$ {
        add_header Cache-Control "no-store";
    }

    # 带内容哈希的产物可以长缓存
    location ~* \.(?:js|wasm|json|css|png|jpg|jpeg|gif|svg|woff2?|ttf|otf|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # --------------------------------------------------------------------------
    # 2. 后端 API
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://app:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 3. 图片（MinIO）
    # --------------------------------------------------------------------------
    # 请求 /img/campustrade/<objectKey>  ->  http://minio:9000/campustrade/<objectKey>
    # 于是 MINIO_URL_PREFIX 只需写成 http://<公网地址>:<端口>/img/campustrade
    location /img/ {
        proxy_pass http://minio:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 健康检查用的探针（不暴露任何内部信息）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
