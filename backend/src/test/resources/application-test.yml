# ==============================================================================
#  测试环境覆盖配置（profile: test）
#
#  基础设施由 Testcontainers 提供，全部是"每个测试 JVM 拉起的全新一次性容器"：
#    - PostgreSQL : postgres:16.15，全新实例 + Flyway 从空库执行全部迁移（干净库）
#    - Redis      : redis:7.4.11
#    - MinIO      : minio/minio:RELEASE.2024-10-13T13-34-11Z，测试桶 campustrade-test
#  （镜像 tag 固定，与 docker-compose.yml 一致；不写死"迁移到第几版"这类会过时的版本区间。）
#  端口在运行时随机分配，所以 datasource / redis / flyway / mybatis-plus schema 等连接类配置
#  一律不在这里写死，而是由 com.campustrade.support.TestContainersConfig 在启动容器后自动注入
#  （详见该类顶部注释）。
#
#  本文件只保留"与基础设施无关"的覆盖项。
# ==============================================================================

minio:
  # 测试专用桶（endpoint / access-key / secret-key 由容器动态注入）。
  # 桶不存在时 MinioConfig 会自动创建，因此无需预先建桶。
  bucket-name: campustrade-test

verify:
  # 测试环境绝不真实发信：验证码走 verify.mail-enabled=false 的服务端日志通道，
  # 测试代码直接从 Redis 读取验证码完成核销（见 CampusTradeStage1Tests）。
  # 显式写死 false，即使本机 .env 里开了 VERIFY_MAIL_ENABLED=true 也不会让测试去连 SMTP。
  mail-enabled: false

logging:
  level:
    # 测试期间降低噪音，但保留业务包 DEBUG 便于定位失败原因
    root: WARN
    com.campustrade: DEBUG
