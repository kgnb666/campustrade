# ==============================================================================
#  生产环境覆盖配置（profile: prod）
#
#  启用方式：环境变量 SPRING_PROFILES_ACTIVE=prod
#
#  本文件的三条原则：
#   1. 【无可用默认值】数据库 / Redis / MinIO / JWT 等敏感项一律写成
#      ${ENV_VAR:} 空默认值：本文件里不存在任何"能连上某个真实服务"的取值，
#      漏配时是"连不上"而不是"连到了本机开发库"。
#   2. 【缺失即拒绝启动】空值不会被静默接受：
#      - com.campustrade.config.ProdSecretsGuard（本文件同目录）在启动期校验
#        连接目标与凭据是否齐备、是否仍是 .env.example 的 CHANGE_ME 占位符，
#        缺失时打印中文提示并直接拒绝启动；
#      - JWT 密钥由 JwtTokenProvider 的 fail-fast 校验（缺失/短于 32 字节/命中历史默认密钥）；
#      - SMTP 由 VerifyMailProdGuard 的 fail-fast 校验（下方 verify.mail-enabled: true）。
#   3. 【日志不泄密】日志级别固定 INFO，并关闭 MyBatis 的 SQL DEBUG 打印：
#      SQL 日志会带出参数值（手机号、口令哈希、验证码等），生产环境不应出现。
#
#  生产必须由部署平台注入的环境变量清单（不要写进任何配置文件或镜像）：
#    数据库   SPRING_DATASOURCE_HOST / SPRING_DATASOURCE_PORT / SPRING_DATASOURCE_DATABASE
#             SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
#    缓存     SPRING_DATA_REDIS_HOST / SPRING_DATA_REDIS_PORT / SPRING_DATA_REDIS_PASSWORD
#    对象存储 MINIO_ENDPOINT / MINIO_ROOT_USER / MINIO_ROOT_PASSWORD / MINIO_BUCKET_NAME
#             MINIO_URL_PREFIX（对外可访问的图片前缀，必须是真实域名，否则前端图片全裂）
#    认证     JWT_SECRET（openssl rand -hex 32）
#    邮件     MAIL_HOST / MAIL_PORT / MAIL_USERNAME / MAIL_PASSWORD / MAIL_FROM
#             （465 端口保持 MAIL_SSL_ENABLED 默认 true；587(STARTTLS) 置为 false）
#    跨域     CORS_ALLOWED_ORIGINS（真实域名清单，绝不可是 "*"）
#    代理     SECURITY_TRUSTED_PROXIES（可选。仅当服务前有我们自己的反向代理时才配置，
#             例如 10.0.0.0/8,172.17.0.0/16；不配置 = 完全不采信 X-Forwarded-For/X-Real-IP）
#  可选：DEEPSEEK_API_KEY（不注入则 AI 能力优雅降级）、SPRING_DATASOURCE_MAX_POOL_SIZE 等调优项。
# ==============================================================================

server:
  # 收到 SIGTERM 后先停止接收新请求再退出，配合编排的 stop_grace_period 使用
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    # 连接目标与凭据全部来自环境变量：本文件不留任何可用的本机默认值
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:}:${SPRING_DATASOURCE_PORT:}/${SPRING_DATASOURCE_DATABASE:}?currentSchema=${SPRING_DATASOURCE_SCHEMA:campus_trade}&reWriteBatchedInserts=true
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      # 生产连接池收敛：并发更高但单连接超时必须更短，避免请求线程被慢查询拖死
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:20}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:5}
      connection-timeout: 10000      # 取连接最长等 10 秒（开发 30 秒，生产快速失败）
      validation-timeout: 3000
      idle-timeout: 300000           # 5 分钟
      max-lifetime: 1200000          # 20 分钟，短于常见 LB/防火墙的 30 分钟空闲断连
      keepalive-time: 120000
      # 启动即校验连接：凭据/网络有问题时立刻启动失败，而不是等到第一个请求
      initialization-fail-timeout: 10000

  flyway:
    # 生产禁止自动 baseline：一个"非空且没有 flyway_schema_history"的库意味着
    # 库结构来路不明（手工建表 / 从别处拷贝），此时必须人工确认，
    # 而不是给它打个 version=0 的基线再把 V1..V11 跑一遍。
    baseline-on-migrate: false
    validate-on-migrate: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:}
      port: ${SPRING_DATA_REDIS_PORT:}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      # 命令超时收敛到 3 秒（base 为 5 秒）：Redis 抖动时快速失败，
      # 不让业务线程把时间耗在等待缓存上。
      timeout: 3000ms
      # Lettuce 连接池：commons-pool2 已在 pom 中显式引入，因此这些参数真实生效
      # （只配 lettuce.pool.* 而不引入 commons-pool2 会被 Spring Boot 静默忽略，
      #  表现为"看起来配了连接池、实际仍共用单条线程安全连接"）。
      # 生产池上限按"应用实例数 × max-active 不超过 Redis maxclients"来定。
      lettuce:
        pool:
          max-active: ${SPRING_DATA_REDIS_POOL_MAX_ACTIVE:32}
          max-idle: ${SPRING_DATA_REDIS_POOL_MAX_IDLE:16}
          min-idle: ${SPRING_DATA_REDIS_POOL_MIN_IDLE:4}
          max-wait: ${SPRING_DATA_REDIS_POOL_MAX_WAIT:1000ms}
          time-between-eviction-runs: 30s

# ------------------------------------------------------------------------------
# 校园认证验证码在生产环境只有一条合法路径：经 SMTP 真实发送到学生校园邮箱。
# verify.mail-enabled=false 会让验证码落到服务端日志文件里（任何能读日志的人都能
# 零成本完成认证），且邮件发送失败时绝不允许降级为"把验证码写进日志或响应"。
# 因此这里显式把邮件通道置为 true，并由 VerifyMailProdGuard 做启动期 fail-fast 校验：
#   - verify.mail-enabled=false                → 拒绝启动
#   - mail-enabled=true 但 MAIL_* 缺项          → 拒绝启动
# ------------------------------------------------------------------------------
verify:
  mail-enabled: true

# ------------------------------------------------------------------------------
# MinIO：端点、凭据、桶名、对外前缀全部来自环境变量，无本机默认值。
# url-prefix 尤其关键：它被拼进返回给前端的图片地址，若沿用开发默认值
# （http://127.0.0.1:9000/...），生产环境浏览器取图将全部失败。
# ------------------------------------------------------------------------------
minio:
  endpoint: ${MINIO_ENDPOINT:}
  access-key: ${MINIO_ROOT_USER:}
  secret-key: ${MINIO_ROOT_PASSWORD:}
  bucket-name: ${MINIO_BUCKET_NAME:}
  url-prefix: ${MINIO_URL_PREFIX:}

# ------------------------------------------------------------------------------
# JWT：只从环境变量读取，本文件同样不提供默认值（base 的 application.yml 也已是空默认）。
# 密钥强度与历史默认密钥拦截见 JwtTokenProvider#init。
# ------------------------------------------------------------------------------
jwt:
  secret: ${JWT_SECRET:}

# ------------------------------------------------------------------------------
# CORS：生产必须显式列出真实域名。allowCredentials 恒为 true，因此绝不允许 "*"。
# ------------------------------------------------------------------------------
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# ------------------------------------------------------------------------------
# 限流与配额阈值：生产沿用 base 的默认值即可，这里显式列出便于运维按容量调整。
#   - security.trusted-proxies：默认空（不采信转发头）。若前面有反向代理必须显式配置，
#     否则限流维度会退化为"代理的 IP"，所有用户共用一个计数（IP 维度的登录锁定会误伤全站）；
#   - ai.quota.*：AI 单账号日配额与分钟频控；
#   - security.token-endpoint.*：/auth/refresh 与 /auth/logout 的双维度限流。
# ------------------------------------------------------------------------------
security:
  trusted-proxies: ${SECURITY_TRUSTED_PROXIES:}

ai:
  quota:
    daily-limit: ${AI_QUOTA_DAILY_LIMIT:50}
    per-minute-limit: ${AI_QUOTA_PER_MINUTE_LIMIT:10}

# ------------------------------------------------------------------------------
# DeepSeek AI：可选能力。未注入 API Key 时 DeepSeekClient 优雅降级（返回业务错误），
# 这里不再保留开发用的占位符字面量。
# ------------------------------------------------------------------------------
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}

# ------------------------------------------------------------------------------
# 日志：固定 INFO，并关闭 MyBatis 的 SQL 打印。
#   - logging.level.com.baomidou.mybatisplus: 由开发环境的 DEBUG 收敛为 WARN；
#   - mybatis-plus.configuration.log-impl: 置为 NoLoggingImpl，
#     即使有人误把级别调成 DEBUG，也不会再把 SQL 与其参数值打到日志里。
# ------------------------------------------------------------------------------
logging:
  level:
    root: INFO
    com.campustrade: INFO
    com.baomidou.mybatisplus: WARN
    org.apache.ibatis: WARN
    org.springframework: INFO
    org.springframework.web: INFO
    org.springframework.security: WARN

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
