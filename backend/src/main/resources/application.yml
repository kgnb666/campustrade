server:
  # 端口只有一处配置：项目根目录 .env 的 BACKEND_PORT。
  # 本机 8080 被另一个项目（图书管理系统）占用，故默认 8081。
  # 读取链路：.env(BACKEND_PORT) → backend/run-backend.cmd 导出为环境变量 SERVER_PORT
  # → 这里的 ${SERVER_PORT:8081}。启动器 start.ps1 / 停止脚本 stop.ps1 / 前端默认基址
  # 同样只读 .env 的 BACKEND_PORT，不要在任何地方再写死端口。
  # 生产：docker-compose.prod.yml 直接注入 SERVER_PORT=8081（容器内外一致）。
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api

spring:
  application:
    name: campus-trade-backend

  # 数据库配置 (PostgreSQL 16)
  # 口令刻意不给默认值：本地开发由项目根目录 .env 的 SPRING_DATASOURCE_PASSWORD 注入
  # （backend/run-backend.cmd 负责导出），生产由部署平台注入；缺失时连不上库即启动失败，
  # 而不是悄悄用一个"写在源码里、人人可见"的开发口令连上去（见 ProdSecretsGuard）。
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:127.0.0.1}:${SPRING_DATASOURCE_PORT:15435}/${SPRING_DATASOURCE_DATABASE:campustrade}?currentSchema=${SPRING_DATASOURCE_SCHEMA:campus_trade}&reWriteBatchedInserts=true
    username: ${SPRING_DATASOURCE_USERNAME:campustrade}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Flyway 数据库迁移管理
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    schemas: campus_trade
    default-schema: campus_trade
    locations: classpath:db/migration
    out-of-order: false

  # Redis 配置 (Redis 7)
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 5000ms
      # Lettuce 连接池（依赖 org.apache.commons:commons-pool2，已在 pom 中显式引入）
      # 不引入 commons-pool2 时这里的 lettuce.pool.* 会被 Spring Boot 静默忽略
      # （表现为"配置看起来生效、实际仍共用单条连接"），因此依赖与配置必须成对出现。
      lettuce:
        pool:
          max-active: ${SPRING_DATA_REDIS_POOL_MAX_ACTIVE:16}    # 最大连接数
          max-idle: ${SPRING_DATA_REDIS_POOL_MAX_IDLE:8}         # 最大空闲连接
          min-idle: ${SPRING_DATA_REDIS_POOL_MIN_IDLE:2}         # 最小空闲连接（预热，避免突发时现建连）
          max-wait: ${SPRING_DATA_REDIS_POOL_MAX_WAIT:2000ms}    # 取连接最长等待，超时快速失败
          time-between-eviction-runs: 30s                        # 空闲连接回收扫描间隔

  # 文件上传限制
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

# MinIO 对象存储配置
# secret-key 同样不给默认值（口令不写进源码）：本地开发由 .env 的 MINIO_ROOT_PASSWORD 注入。
minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${MINIO_ROOT_USER:campustrade}
  secret-key: ${MINIO_ROOT_PASSWORD:}
  bucket-name: ${MINIO_BUCKET_NAME:campustrade}
  url-prefix: ${MINIO_URL_PREFIX:http://127.0.0.1:9000/campustrade}

# JWT 认证配置
# secret 只从环境变量 JWT_SECRET 读取，此处刻意不提供任何默认值：
# 缺失 / 长度不足 32 字节 / 命中历史默认密钥时，JwtTokenProvider 会在启动期直接拒绝启动。
# 本地开发在项目根目录 .env 中配置（由 backend/run-backend.cmd 注入）；生产由部署环境注入。
jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: 7200000 # 2小时 (毫秒)
  refresh-token-expiration: 604800000 # 7天 (毫秒)

# 认证防护阈值配置
security:
  login:
    max-failures: ${SECURITY_LOGIN_MAX_FAILURES:5}       # 连续登录失败次数上限
    lock-minutes: ${SECURITY_LOGIN_LOCK_MINUTES:15}      # 触发上限后的锁定窗口（分钟）
  register:
    ip-limit-per-hour: ${SECURITY_REGISTER_IP_LIMIT:20}  # 单一来源 IP 每小时注册请求上限
  # 可信反向代理网段（逗号分隔，支持 CIDR 与精确 IP，IPv4/IPv6 均可）。
  # 默认空 = 完全不采信 X-Forwarded-For / X-Real-IP，一律使用 TCP 对端地址 remoteAddr。
  # 只有在服务前面确实存在我们自己的反向代理（Nginx/TLB/Ingress）时才配置它，
  # 并把代理自身的地址（例如 10.0.0.0/8 或 172.17.0.0/16）写进来；
  # 绝不能写 0.0.0.0/0（那等于又变成无条件采信客户端头部）。
  trusted-proxies: ${SECURITY_TRUSTED_PROXIES:}
  # /auth/refresh 与 /auth/logout：未认证即可调用，且每次都要做 JWT 验签，因此按
  # "真实来源 IP + 令牌指纹（sha256 前 16 位）"双维度限流（分钟窗口）。
  token-endpoint:
    ip-limit-per-minute: ${SECURITY_TOKEN_ENDPOINT_IP_LIMIT:30}
    token-limit-per-minute: ${SECURITY_TOKEN_ENDPOINT_TOKEN_LIMIT:10}

# AI 商品助手调用配额（按 userId 计；AI 调用是直接产生费用的外部依赖）
ai:
  quota:
    daily-limit: ${AI_QUOTA_DAILY_LIMIT:50}          # 单账号每日上限
    per-minute-limit: ${AI_QUOTA_PER_MINUTE_LIMIT:10} # 单账号每分钟上限

# 校园身份认证（验证码下发与核销）配置
# mail-enabled 是"验证码去哪儿"的唯一开关：
#   true  → 经 SMTP 真实发送到学生校园邮箱（生产必须为 true，见 application-prod.yml）
#   false → 验证码写入服务端日志（[DEV-ONLY] 行），仅限本地开发
# 生产环境（profile: prod）下 mail-enabled=false 或 MAIL_* 缺项都会在启动期直接拒绝启动
# （见 com.campustrade.config.VerifyMailProdGuard），避免"看日志即可自证"的通道被带上线。
verify:
  mail-enabled: ${VERIFY_MAIL_ENABLED:false}
  # SMTP 连接信息只从环境变量读取：源码与任何配置文件里都不存在可用的邮箱账号或口令字面量
  mail-host: ${MAIL_HOST:}
  mail-port: ${MAIL_PORT:465}
  mail-username: ${MAIL_USERNAME:}
  mail-password: ${MAIL_PASSWORD:}
  mail-from: ${MAIL_FROM:}
  mail-ssl-enabled: ${MAIL_SSL_ENABLED:true}   # 465 端口为 true；587(STARTTLS) 置为 false
  mail-timeout-ms: ${MAIL_TIMEOUT_MS:5000}
  code-ttl-minutes: 5                # 验证码有效期，同时是"核验失败计数键"的 TTL
  max-failures: 5                    # 同一验证码最多允许输错 5 次，达到即作废
  # 发送限流维度为"发起人 userId × 目标校园邮箱"（24 小时 3 次）。
  # 不能退回"仅按邮箱计数"：那样任意账号都能把他人邮箱的当日额度打满，
  # 使被攻击者当天无法认证，同时给对方持续投递垃圾验证码邮件。
  send-limit-per-user-email: 3
  user-email-send-window-hours: 24
  send-limit-per-user: 3             # 同一用户 10 分钟内最多发送 3 次
  user-send-window-minutes: 10

  # 演示模式：给"个人开发者没有学校邮箱，但仍要演示认证流程"用的一条通道。
  # 开启后，**白名单内**的邮箱不再发送真实邮件，验证码随 /student/verify 的响应返回，
  # 前端会自动填入并在页面上标注"演示模式"。
  #
  # 为什么必须是白名单而不是一个全局开关：验证码随响应返回等于"零成本自证"，
  # 一旦作用到全站，校园认证就不再可信。白名单把影响面钉死在配置点名的几个邮箱上，
  # 其余邮箱的链路（后缀校验、双向限流、真实邮件、失败不降级）一个字节都不变。
  #
  # 两条护栏（见 com.campustrade.config.VerifyDemoGuard）：
  #   - 开关打开但白名单为空 → 启动期直接拒绝启动（那多半是配置事故）；
  #   - 生效时每次启动都打一条点名邮箱的 WARN，演示模式"忘了关"能被立刻看见。
  # 默认全关：不配置这两项时，行为与没有演示模式时完全一致。
  demo-mode-enabled: ${VERIFY_DEMO_MODE_ENABLED:false}
  demo-emails: ${VERIFY_DEMO_EMAILS:}   # 逗号分隔；建议用明显不存在的演示号，别填真实学生邮箱

# CORS 跨域来源白名单 (逗号分隔，支持 http://localhost:* 端口通配)
# allowCredentials 恒为 true，因此绝不允许写 "*"：那等于允许任意站点携带凭据访问本服务。
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.campustrade.entity
  type-enums-package: com.campustrade.enums
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      schema: campus_trade
      table-prefix: ""
      id-type: assign_id

# DeepSeek AI 开放接口配置
# api-key 的默认值刻意写成 CHANGE_ME_ 前缀的占位符：与 .env.example / ProdSecretsGuard.isPlaceholder
# 使用同一套"未填写"判定规则（见 ProdSecretsGuard 的 PLACEHOLDER_PREFIX 常量）。
# 未配置时 DeepSeekClient 会走本地优雅降级（结构化兜底文案/分类/估价），不影响本地开发。
# 生产环境由部署平台注入 DEEPSEEK_API_KEY；若误把占位符带上线，AI 调用同样只会降级而不会外发请求。
deepseek:
  api-key: ${DEEPSEEK_API_KEY:CHANGE_ME_deepseek_api_key}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  timeout: ${DEEPSEEK_TIMEOUT:15000}

# 日志配置
# 业务包保持 INFO：DEBUG 级别会把请求细节（含凭据类字段）打印到日志，生产环境不应开启。
logging:
  level:
    root: INFO
    com.campustrade: INFO
    org.springframework.web: INFO
    com.baomidou.mybatisplus: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
