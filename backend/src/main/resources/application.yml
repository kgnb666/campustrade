server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: campus-trade-backend

  # 数据库配置 (PostgreSQL 16)
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:127.0.0.1}:${SPRING_DATASOURCE_PORT:15435}/${SPRING_DATASOURCE_DATABASE:campustrade}?currentSchema=${SPRING_DATASOURCE_SCHEMA:campus_trade}&reWriteBatchedInserts=true
    username: ${SPRING_DATASOURCE_USERNAME:campustrade}
    password: ${SPRING_DATASOURCE_PASSWORD:campustrade123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Flyway 数据库迁移管理
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    schemas: campus_trade
    default-schema: campus_trade
    locations: classpath:db/migration
    out-of-order: false

  # Redis 配置 (Redis 7)
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 5000ms

  # 文件上传限制
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

# MinIO 对象存储配置
minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${MINIO_ROOT_USER:campustrade}
  secret-key: ${MINIO_ROOT_PASSWORD:campustrade123}
  bucket-name: ${MINIO_BUCKET_NAME:campustrade}
  url-prefix: ${MINIO_URL_PREFIX:http://127.0.0.1:9000/campustrade}

# JWT 认证配置
# secret 只从环境变量 JWT_SECRET 读取，此处刻意不提供任何默认值：
# 缺失 / 长度不足 32 字节 / 命中历史默认密钥时，JwtTokenProvider 会在启动期直接拒绝启动。
# 本地开发在项目根目录 .env 中配置（由 backend/run-backend.cmd 注入）；生产由部署环境注入。
jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: 7200000 # 2小时 (毫秒)
  refresh-token-expiration: 604800000 # 7天 (毫秒)

# 认证防护阈值配置
security:
  login:
    max-failures: ${SECURITY_LOGIN_MAX_FAILURES:5}       # 连续登录失败次数上限
    lock-minutes: ${SECURITY_LOGIN_LOCK_MINUTES:15}      # 触发上限后的锁定窗口（分钟）
  register:
    ip-limit-per-hour: ${SECURITY_REGISTER_IP_LIMIT:20}  # 单一来源 IP 每小时注册请求上限

# CORS 跨域来源白名单 (逗号分隔，支持 http://localhost:* 端口通配)
# allowCredentials 恒为 true，因此绝不允许写 "*"：那等于允许任意站点携带凭据访问本服务。
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.campustrade.entity
  type-enums-package: com.campustrade.enums
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      schema: campus_trade
      table-prefix: ""
      id-type: assign_id

# DeepSeek AI 开放接口配置
deepseek:
  api-key: ${DEEPSEEK_API_KEY:your_deepseek_api_key_here}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  timeout: ${DEEPSEEK_TIMEOUT:15000}

# 日志配置
# 业务包保持 INFO：DEBUG 级别会把请求细节（含凭据类字段）打印到日志，生产环境不应开启。
logging:
  level:
    root: INFO
    com.campustrade: INFO
    org.springframework.web: INFO
    com.baomidou.mybatisplus: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
