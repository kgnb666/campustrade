server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: campus-trade-backend

  # 数据库配置 (PostgreSQL 16)
  # 口令刻意不给默认值：本地开发由项目根目录 .env 的 SPRING_DATASOURCE_PASSWORD 注入
  # （backend/run-backend.cmd 负责导出），生产由部署平台注入；缺失时连不上库即启动失败，
  # 而不是悄悄用一个"写在源码里、人人可见"的开发口令连上去（见 ProdSecretsGuard）。
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:127.0.0.1}:${SPRING_DATASOURCE_PORT:15435}/${SPRING_DATASOURCE_DATABASE:campustrade}?currentSchema=${SPRING_DATASOURCE_SCHEMA:campus_trade}&reWriteBatchedInserts=true
    username: ${SPRING_DATASOURCE_USERNAME:campustrade}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Flyway 数据库迁移管理
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    schemas: campus_trade
    default-schema: campus_trade
    locations: classpath:db/migration
    out-of-order: false

  # Redis 配置 (Redis 7)
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 5000ms

  # 文件上传限制
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

# MinIO 对象存储配置
# secret-key 同样不给默认值（口令不写进源码）：本地开发由 .env 的 MINIO_ROOT_PASSWORD 注入。
minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${MINIO_ROOT_USER:campustrade}
  secret-key: ${MINIO_ROOT_PASSWORD:}
  bucket-name: ${MINIO_BUCKET_NAME:campustrade}
  url-prefix: ${MINIO_URL_PREFIX:http://127.0.0.1:9000/campustrade}

# JWT 认证配置
# secret 只从环境变量 JWT_SECRET 读取，此处刻意不提供任何默认值：
# 缺失 / 长度不足 32 字节 / 命中历史默认密钥时，JwtTokenProvider 会在启动期直接拒绝启动。
# 本地开发在项目根目录 .env 中配置（由 backend/run-backend.cmd 注入）；生产由部署环境注入。
jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: 7200000 # 2小时 (毫秒)
  refresh-token-expiration: 604800000 # 7天 (毫秒)

# 认证防护阈值配置
security:
  login:
    max-failures: ${SECURITY_LOGIN_MAX_FAILURES:5}       # 连续登录失败次数上限
    lock-minutes: ${SECURITY_LOGIN_LOCK_MINUTES:15}      # 触发上限后的锁定窗口（分钟）
  register:
    ip-limit-per-hour: ${SECURITY_REGISTER_IP_LIMIT:20}  # 单一来源 IP 每小时注册请求上限

# 校园身份认证（验证码下发与核销）配置
# mail-enabled 是"验证码去哪儿"的唯一开关：
#   true  → 经 SMTP 真实发送到学生校园邮箱（生产必须为 true，见 application-prod.yml）
#   false → 验证码写入服务端日志（[DEV-ONLY] 行），仅限本地开发
# 生产环境（profile: prod）下 mail-enabled=false 或 MAIL_* 缺项都会在启动期直接拒绝启动
# （见 com.campustrade.config.VerifyMailProdGuard），避免"看日志即可自证"的通道被带上线。
verify:
  mail-enabled: ${VERIFY_MAIL_ENABLED:false}
  # SMTP 连接信息只从环境变量读取：源码与任何配置文件里都不存在可用的邮箱账号或口令字面量
  mail-host: ${MAIL_HOST:}
  mail-port: ${MAIL_PORT:465}
  mail-username: ${MAIL_USERNAME:}
  mail-password: ${MAIL_PASSWORD:}
  mail-from: ${MAIL_FROM:}
  mail-ssl-enabled: ${MAIL_SSL_ENABLED:true}   # 465 端口为 true；587(STARTTLS) 置为 false
  mail-timeout-ms: ${MAIL_TIMEOUT_MS:5000}
  code-ttl-minutes: 5                # 验证码有效期，同时是"核验失败计数键"的 TTL
  max-failures: 5                    # 同一验证码最多允许输错 5 次，达到即作废
  send-limit-per-email: 5            # 同一校园邮箱在 24 小时内最多发送 5 次
  email-send-window-hours: 24
  send-limit-per-user: 3             # 同一用户 10 分钟内最多发送 3 次
  user-send-window-minutes: 10

# CORS 跨域来源白名单 (逗号分隔，支持 http://localhost:* 端口通配)
# allowCredentials 恒为 true，因此绝不允许写 "*"：那等于允许任意站点携带凭据访问本服务。
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.campustrade.entity
  type-enums-package: com.campustrade.enums
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      schema: campus_trade
      table-prefix: ""
      id-type: assign_id

# DeepSeek AI 开放接口配置
deepseek:
  api-key: ${DEEPSEEK_API_KEY:your_deepseek_api_key_here}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  timeout: ${DEEPSEEK_TIMEOUT:15000}

# 日志配置
# 业务包保持 INFO：DEBUG 级别会把请求细节（含凭据类字段）打印到日志，生产环境不应开启。
logging:
  level:
    root: INFO
    com.campustrade: INFO
    org.springframework.web: INFO
    com.baomidou.mybatisplus: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
