services:
  # 1. 关系型数据库：PostgreSQL 16
  postgres:
    image: postgres:16
    container_name: campustrade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campustrade
      POSTGRES_USER: campustrade
      POSTGRES_PASSWORD: campustrade123
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campustrade -d campustrade"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - campustrade-network

  # 2. 高速缓存与会话：Redis 7
  redis:
    image: redis:7
    container_name: campustrade-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - campustrade-network

  # 3. 分布式对象存储：MinIO (商品图片与附件存储)
  minio:
    image: minio/minio:latest
    container_name: campustrade-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-campustrade}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-campustrade123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campustrade-network

volumes:
  postgres_data:
    name: campustrade_postgres_data
  redis_data:
    name: campustrade_redis_data
  minio_data:
    name: campustrade_minio_data

networks:
  campustrade-network:
    name: campustrade-network
    driver: bridge
